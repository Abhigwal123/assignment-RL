[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stockrl-mini"
version = "1.0.0"
description = "Production-grade, verifiable single-stock trading RL simulation environment conforming to Gymnasium v1.0+"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.30.0",
    "altair>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["environment*", "agents*", "grader*"]
